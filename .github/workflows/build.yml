name: 앱 만들기
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk kipeunbam.apk
      - name: 설치 사이트에 새 설치 파일 올리기
        run: |
          git fetch origin gh-pages
          git worktree add site origin/gh-pages
          cp kipeunbam.apk site/kipeunbam.apk
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kipeunbam.apk
          git commit -m "안드로이드 설치 파일 갱신 ${{ github.run_number }}" || exit 0
          git push origin HEAD:gh-pages
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 깊은밤 ${{ github.run_number }}
          files: kipeunbam.apk
